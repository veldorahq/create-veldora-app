name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release + npm Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_NO_V="${VERSION#v}"
          NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \[?${VERSION_NO_V}\]?/{flag=1; next} /^## \[?[0-9]/{if(flag) exit} flag" CHANGELOG.md || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.VERSION }} — see [CHANGELOG.md](https://github.com/veldorahq/create-veldora-app/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo 'NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "create-veldora-app ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's Changed in ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ---

            **Usage:**
            ```bash
            npx create-veldora-app@${{ steps.version.outputs.VERSION }} my-app
            cd my-app
            php veldora serve
            ```

            **Full Changelog**: https://github.com/veldorahq/create-veldora-app/blob/main/CHANGELOG.md
            **Documentation**: https://veldora.modrao.com
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
